services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      portal:
        condition: service_healthy
      connect:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M

  api:
    image: ${API_IMAGE:-ghcr.io/rnadela/zuroy/api:latest}
    restart: unless-stopped
    expose:
      - '3001'
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-zuroy}:${DB_PASSWORD:-zuroy}@db:5432/${DB_NAME:-zuroy_prod}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-15m}
      - API_PORT=3001
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M

  portal:
    image: ${PORTAL_IMAGE:-ghcr.io/rnadela/zuroy/portal:latest}
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
        reservations:
          memory: 128M

  connect:
    image: ${CONNECT_IMAGE:-ghcr.io/rnadela/zuroy/connect:latest}
    restart: unless-stopped
    expose:
      - '3002'
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
        reservations:
          memory: 128M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          memory: 64M

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-zuroy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zuroy}
      POSTGRES_DB: ${DB_NAME:-zuroy_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-zuroy}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
